name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - ".github/workflows/build-ios-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # No Apple Developer account on CI — produce an ad-hoc-signed IPA
      # (Payload/*.app zip). Install via Sideloadly / AltStore / TrollStore
      # (they re-sign with your Apple ID), or open ios/App in Xcode → Run.
      - name: Build iOS app
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        working-directory: ios/App
        run: |
          set -euo pipefail

          APP_PATH="$(find build/Build/Products -name '*.app' -type d | head -n 1)"
          if [[ -z "${APP_PATH}" || ! -d "${APP_PATH}" ]]; then
            echo "ERROR: .app not found under build/Build/Products"
            find build/Build/Products -maxdepth 4 -print || true
            exit 1
          fi
          echo "Using app: ${APP_PATH}"
          ls -la "${APP_PATH}"
          test -f "${APP_PATH}/Info.plist"
          test -f "${APP_PATH}/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP_PATH}/Info.plist")"

          STAGE="$(pwd)/build/ipa-stage"
          DIST="$(pwd)/build/dist"
          rm -rf "${STAGE}" "${DIST}"
          mkdir -p "${STAGE}/Payload" "${DIST}"

          APP_NAME="$(basename "${APP_PATH}")"
          # ditto preserves symlinks / bundle metadata better than cp -r
          ditto "${APP_PATH}" "${STAGE}/Payload/${APP_NAME}"

          # Ad-hoc sign so the bundle is a real codesigned .app inside the IPA
          codesign --force --deep --sign - "${STAGE}/Payload/${APP_NAME}"
          codesign -dv --verbose=2 "${STAGE}/Payload/${APP_NAME}" 2>&1 | tee /tmp/codesign.txt || true

          IPA_PATH="${DIST}/ListenPage.ipa"
          # Apple-style IPA: zip whose root entry is Payload/
          (
            cd "${STAGE}"
            ditto -c -k --sequesterRsrc --keepParent Payload "${IPA_PATH}"
          )

          echo "IPA bytes: $(wc -c < "${IPA_PATH}")"
          # Validate layout
          unzip -l "${IPA_PATH}" | head -n 40
          unzip -l "${IPA_PATH}" | grep -E 'Payload/.+\.app/Info\.plist' >/dev/null
          unzip -l "${IPA_PATH}" | grep -E 'Payload/.+\.app/' >/dev/null

          # Confirm magic: IPA is a zip
          file "${IPA_PATH}" | grep -qi 'zip'
          echo "IPA_PATH=${IPA_PATH}" >> "$GITHUB_ENV"
          echo "Packaged OK → ${IPA_PATH}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ListenPage.ipa
          path: ios/App/build/dist/ListenPage.ipa
          if-no-files-found: error
          retention-days: 30
