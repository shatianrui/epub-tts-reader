name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "scripts/build-ios-ipa.sh"
      - ".github/workflows/build-ios-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build and package IPA
        run: bash scripts/build-ios-ipa.sh

      # archive: false uploads the IPA bytes directly. The default artifact
      # zip is a second archive around an already-zipped IPA; Windows Explorer
      # reports that download as a corrupt compressed file, and an expired
      # artifact download is an error page saved as .zip.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          path: ios/App/build/dist/ListenPage.ipa
          archive: false
          if-no-files-found: error
          retention-days: 90

      # Direct .ipa download (no outer zip): Release asset
      - name: Publish IPA release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ios-latest"
          NOTES="Ad-hoc signed ListenPage IPA (commit ${GITHUB_SHA}).

          **Install:** Sideloadly / AltStore / TrollStore (re-sign with your Apple ID).
          Or open \`ios/App\` in Xcode → Run on a device.

          Download \`ListenPage.ipa\` from this release or from the Actions artifact
          (same file, not wrapped in another zip). Open it with Sideloadly / AltStore,
          not by double-clicking on Windows."

          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" \
            "ios/App/build/dist/ListenPage.ipa" \
            --title "ListenPage iOS (latest)" \
            --notes "${NOTES}" \
            --latest=false
