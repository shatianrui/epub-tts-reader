name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - ".github/workflows/build-ios-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # Ensure local BackgroundAudioPlugin is listed for ObjC class lookup
      # (also registered manually in MainViewController.capacitorDidLoad).
      - name: Register local iOS plugins
        run: |
          set -euo pipefail
          python3 -c '
          import json
          from pathlib import Path
          p = Path("ios/App/App/capacitor.config.json")
          data = json.loads(p.read_text()) if p.exists() else {}
          classes = set(data.get("packageClassList") or [])
          classes.update({"BackgroundAudioPlugin", "App.BackgroundAudioPlugin"})
          data["packageClassList"] = sorted(classes)
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(data, indent=2) + "\n")
          print("packageClassList =", data["packageClassList"])
          '

      # No Apple Developer account on CI — produce an ad-hoc-signed IPA
      # (Payload/*.app). Re-sign with Sideloadly / AltStore / TrollStore, or
      # open ios/App in Xcode → Run on a device.
      - name: Build iOS app
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        working-directory: ios/App
        run: |
          set -euo pipefail

          APP_PATH="$(find build/Build/Products -name '*.app' -type d | head -n 1)"
          if [[ -z "${APP_PATH}" || ! -d "${APP_PATH}" ]]; then
            echo "ERROR: .app not found under build/Build/Products"
            find build/Build/Products -maxdepth 4 -print || true
            exit 1
          fi
          echo "Using app: ${APP_PATH}"
          ls -la "${APP_PATH}"
          test -f "${APP_PATH}/Info.plist"
          EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP_PATH}/Info.plist")"
          test -f "${APP_PATH}/${EXEC}"
          test -d "${APP_PATH}/_CodeSignature" || true

          STAGE="$(pwd)/build/ipa-stage"
          DIST="$(pwd)/build/dist"
          rm -rf "${STAGE}" "${DIST}"
          mkdir -p "${STAGE}/Payload" "${DIST}"

          APP_NAME="$(basename "${APP_PATH}")"
          ditto "${APP_PATH}" "${STAGE}/Payload/${APP_NAME}"

          # Ad-hoc sign so Sideloadly/AltStore see a real app bundle
          codesign --force --deep --sign - "${STAGE}/Payload/${APP_NAME}"
          codesign -dv --verbose=2 "${STAGE}/Payload/${APP_NAME}" 2>&1 | tee /tmp/codesign.txt || true
          test -d "${STAGE}/Payload/${APP_NAME}/_CodeSignature"

          IPA_PATH="${DIST}/ListenPage.ipa"
          # Root of archive MUST be Payload/ (Apple IPA layout)
          (
            cd "${STAGE}"
            # zip -y keeps symlinks; ditto also works — use both-validated zip
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "${IPA_PATH}"
          )

          echo "IPA bytes: $(wc -c < "${IPA_PATH}")"
          file "${IPA_PATH}"
          unzip -l "${IPA_PATH}" | head -n 50

          # Hard fail unless this is a real IPA payload
          unzip -l "${IPA_PATH}" | grep -E 'Payload/.+\.app/Info\.plist' >/dev/null
          unzip -l "${IPA_PATH}" | grep -E 'Payload/.+\.app/_CodeSignature/' >/dev/null
          # Must NOT be a nested GitHub-style single-file wrapper
          COUNT="$(unzip -l "${IPA_PATH}" | awk 'END{print $2}')"
          echo "zip entries≈${COUNT}"
          FILE_OUT="$(file -b "${IPA_PATH}")"
          echo "file(1): ${FILE_OUT}"
          echo "${FILE_OUT}" | grep -Ei 'iOS App Zip|Zip archive' >/dev/null

          # Extract once to prove installers can open it
          VERIFY="$(pwd)/build/ipa-verify"
          rm -rf "${VERIFY}"
          mkdir -p "${VERIFY}"
          unzip -q "${IPA_PATH}" -d "${VERIFY}"
          test -f "${VERIFY}/Payload/${APP_NAME}/Info.plist"
          test -f "${VERIFY}/Payload/${APP_NAME}/${EXEC}"

          echo "IPA_PATH=${IPA_PATH}" >> "$GITHUB_ENV"
          echo "Packaged OK → ${IPA_PATH}"

      # IMPORTANT: artifact *name* must NOT end in .ipa — Actions always wraps
      # downloads in an outer .zip. Naming the artifact "Foo.ipa" makes browsers
      # save the outer zip as Foo.ipa, which is NOT a valid IPA.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ListenPage-iOS
          path: ios/App/build/dist/ListenPage.ipa
          if-no-files-found: error
          retention-days: 30

      # Direct .ipa download (no outer zip): Release asset
      - name: Publish IPA release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ios-latest"
          NOTES="Ad-hoc signed ListenPage IPA (commit ${GITHUB_SHA}).

          **Install:** Sideloadly / AltStore / TrollStore (re-sign with your Apple ID).
          Or open \`ios/App\` in Xcode → Run on a device.

          **Do not** use the Actions artifact zip as if it were the IPA — download
          \`ListenPage.ipa\` from this release instead."

          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" \
            "ios/App/build/dist/ListenPage.ipa" \
            --title "ListenPage iOS (latest)" \
            --notes "${NOTES}" \
            --latest=false
