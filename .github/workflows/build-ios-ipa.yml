name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "scripts/build-ios-ipa.sh"
      - ".github/workflows/build-ios-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build and package IPA
        run: bash scripts/build-ios-ipa.sh

      # IMPORTANT: artifact *name* must NOT end in .ipa — Actions always wraps
      # downloads in an outer .zip. Naming the artifact "Foo.ipa" makes browsers
      # save the outer zip as Foo.ipa, which is NOT a valid IPA.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ListenPage-iOS
          path: ios/App/build/dist/ListenPage.ipa
          if-no-files-found: error
          retention-days: 30

      # Direct .ipa download (no outer zip): Release asset
      - name: Publish IPA release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ios-latest"
          NOTES="Ad-hoc signed ListenPage IPA (commit ${GITHUB_SHA}).

          **Install:** Sideloadly / AltStore / TrollStore (re-sign with your Apple ID).
          Or open \`ios/App\` in Xcode → Run on a device.

          **Do not** use the Actions artifact zip as if it were the IPA — download
          \`ListenPage.ipa\` from this release instead."

          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" \
            "ios/App/build/dist/ListenPage.ipa" \
            --title "ListenPage iOS (latest)" \
            --notes "${NOTES}" \
            --latest=false
